# shelf.library.example.yaml — production configuration for https://library.betterax.net
#
# Copy to the real location, fill the <...> placeholders, then run
#   scripts/deploy/library/preflight.sh --config <your copy>
# Registered values (uni-auth client "zip-viewer", E-74 §2.19) are final. There
# are no secrets in this file: the client is public (PKCE) and the session key
# is generated by the server on first start.
#
# Needs a build that has auth.mode "oidc" (E-74 U-B/U-D). An older binary
# refuses the unknown keys.

server:
  listen: "127.0.0.1"          # loopback only: the tunnel connector is the only caller (§2.18)
  port: 9910                   # must match the tunnel rule (tunnel-apply.sh --service)
  base_path: ""                # keep empty: the registered redirect URI has no prefix
  trusted_proxy_headers: false # MUST stay false (a public-ban condition, §2.18)
  allow_root_editing: false

roots:                         # <fill in: same collection paths as the old server>
  - name: "<root-name>"
    path: "<absolute path to the media directory>"

storage:
  data_dir: "<absolute path>"  # holds user.db (schema 4 after the first start), auth.db, index.db
  cache_dir: "<absolute path>"

auth:
  mode: "oidc"
  session_ttl: "12h"
  oidc:
    issuer: "https://auth.betterax.net"
    client_id: "zip-viewer"
    audience: "https://library.betterax.net/api"
    redirect_url: "https://library.betterax.net/api/auth/oidc/callback"
    post_logout_redirect_url: ""          # open item: the projector drops this field (U-R1 record)
    allowed_subs: []                      # <add your sub after the first 403 screen, then restart>
    admin_subs: []                        # subset of allowed_subs
    legacy_owner_sub: ""                  # your sub: moves the pre-oidc progress to you once (§2.14)

log:
  level: "info"
